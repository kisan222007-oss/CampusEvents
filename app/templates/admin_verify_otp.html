<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - CampusEvents</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 12px;
            color: #333;
        }

        .info {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 6px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .flash {
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            background: #ffe5e5;
            color: #c62828;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">CampusEvents</div>

    <div class="subtitle">Password Recovery</div>

    <h2>Verify OTP</h2>

    <div class="info">
        Enter the 6-digit OTP sent to your registered email.
        <br>
        OTP expires in 10 minutes.
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label for="otp">OTP</label>

        <input
            type="text"
            id="otp"
            name="otp"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            placeholder="000000"
            required
            autocomplete="one-time-code"
        >

        <button type="submit">
            Verify OTP
        </button>

    </form>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - RAIT Events</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

{% include 'toast.html' %}

<nav class="navbar">

    <div class="logo">
        <i class="fa-solid fa-graduation-cap"></i> RAIT Events
    </div>

    <ul class="nav-links">

        <li>
            <a href="/">Home</a>
        </li>

        <li>
            <a href="/events">Events</a>
        </li>

        <li>
            <a href="/student-login">Student Login</a>
        </li>

    </ul>

</nav>

<div class="container">

    <div class="page-title">

        <h1><i class="fa-solid fa-lock"></i> Create New Password</h1>

        <p>
            Enter your new password below.
        </p>

    </div>

    <div class="dashboard-card"
         style="max-width: 500px; margin: 30px auto;">

        <form method="POST">

            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <div style="position: relative;">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                        style="padding-right: 50px;">

                    <button
                        type="button"
                        onclick="togglePassword('password', this)"
                        style="
                            position: absolute;
                            right: 10px;
                            top: 50%;
                            transform: translateY(-50%);
                            border: none;
                            background: none;
                            cursor: pointer;
                            font-size: 18px;
                        ">
                        👁️
                    </button>
                </div>

            </div>

            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <div style="position: relative;">
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                        style="padding-right: 50px;">

                    <button
                        type="button"
                        onclick="togglePassword('confirm_password', this)"
                        style="
                            position: absolute;
                            right: 10px;
                            top: 50%;
                            transform: translateY(-50%);
                            border: none;
                            background: none;
                            cursor: pointer;
                            font-size: 18px;
                        ">
                        👁️
                    </button>
                </div>

            </div>

            <button
                type="submit"
                class="btn btn-primary">

                <i class="fa-solid fa-lock"></i> Update Password

            </button>

        </form>

    </div>

</div>

<script>
function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
    } else {
        input.type = "password";
    }

}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RAIT Events</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    {% include 'toast.html' %}

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i> RAIT Events
        </div>
                <div class="mobile-menu-btn" onclick="this.nextElementSibling.classList.toggle('active')">
            <i class="fa-solid fa-bars"></i>
        </div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/events">Events</a></li>
            <li><a href="/login">Login</a></li>
        </ul>
    </nav>

    <!-- ================= REGISTRATION FORM ================= -->
    <div class="form-container">
        <h1>Event Registration <i class="fa-solid fa-pen-to-square"></i></h1>

        <form action="/register" method="POST">

            <!-- NAME -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <!-- COLLEGE ID -->
            <div class="form-group">
                <label for="college_id">College ID</label>
                <input type="text" id="college_id" name="college_id" placeholder="Enter your college ID" required>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <!-- PHONE -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            </div>

            <!-- EVENT -->
            <div class="form-group">
                <label for="event">Select Event</label>
                <select id="event" name="event" required>
                    <option value="">-- Select an Event --</option>
                    {% for event in events %}
                    <option value="{{ event[1] }}">
                        <i class="fa-solid fa-calendar-check"></i> {{ event[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- SUBMIT -->
            <button type="submit" class="btn btn-primary">
                Register for Event
            </button>

        </form>
    </div>

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
        <p>© 2026 RAIT Events | RAIT, DY Patil University Campus, Nerul, Navi Mumbai</p>
        <p>College Event Management System</p>
    </footer>


    <!-- Lenis Smooth Scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const lenis = new Lenis({
                duration: 0.6,
                easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                direction: 'vertical',
                gestureDirection: 'vertical',
                smooth: true,
                smoothTouch: false,
                touchMultiplier: 2
            });

            function raf(time) {
                lenis.raf(time);
                requestAnimationFrame(raf);
            }

            requestAnimationFrame(raf);
        });
    </script>
</body>

</html>

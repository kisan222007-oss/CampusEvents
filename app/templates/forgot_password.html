<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - RAIT Events</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

{% include 'toast.html' %}

<nav class="navbar">

    <div class="logo">
        <i class="fa-solid fa-graduation-cap"></i> RAIT Events
    </div>

            <div class="mobile-menu-btn" onclick="this.nextElementSibling.classList.toggle('active')">
            <i class="fa-solid fa-bars"></i>
        </div>
        <ul class="nav-links">

        <li>
            <a href="/">Home</a>
        </li>

        <li>
            <a href="/events">Events</a>
        </li>

        <li>
            <a href="/student-login">Student Login</a>
        </li>

    </ul>

</nav>

<div class="container">

    <div class="page-title">

        <h1>🔑 Forgot Password</h1>

        <p>
            Verify your College ID and registered email.
        </p>

    </div>

    <div class="dashboard-card"
         style="max-width: 500px; margin: 30px auto;">

        <form method="POST">

            <div class="form-group">

                <label for="college_id">
                    College ID
                </label>

                <input
                    type="text"
                    id="college_id"
                    name="college_id"
                    placeholder="Enter your College ID"
                    required>

            </div>

            <div class="form-group">

                <label for="email">
                    Registered Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary">

                Continue →

            </button>

        </form>

    </div>

</div>


    <!-- Lenis Smooth Scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const lenis = new Lenis({
                duration: 0.6,
                easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                direction: 'vertical',
                gestureDirection: 'vertical',
                smooth: true,
                smoothTouch: false,
                touchMultiplier: 2
            });

            function raf(time) {
                lenis.raf(time);
                requestAnimationFrame(raf);
            }

            requestAnimationFrame(raf);
        });
    </script>
</body>
</html>

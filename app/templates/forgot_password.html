<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - CampusEvents</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

{% include 'toast.html' %}

<nav class="navbar">

    <div class="logo">
        🎓 CampusEvents
    </div>

    <ul class="nav-links">

        <li>
            <a href="/">Home</a>
        </li>

        <li>
            <a href="/events">Events</a>
        </li>

        <li>
            <a href="/student-login">Student Login</a>
        </li>

    </ul>

</nav>

<div class="container">

    <div class="page-title">

        <h1>🔑 Forgot Password</h1>

        <p>
            Verify your College ID and registered email.
        </p>

    </div>

    <div class="dashboard-card"
         style="max-width: 500px; margin: 30px auto;">

        <form method="POST">

            <div class="form-group">

                <label for="college_id">
                    College ID
                </label>

                <input
                    type="text"
                    id="college_id"
                    name="college_id"
                    placeholder="Enter your College ID"
                    required>

            </div>

            <div class="form-group">

                <label for="email">
                    Registered Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary">

                Continue →

            </button>

        </form>

    </div>

</div>

</body>
</html>

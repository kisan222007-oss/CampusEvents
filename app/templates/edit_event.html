<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Event - RAIT Events</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    {% include 'toast.html' %}

    <nav class="navbar">

        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i> RAIT Events
        </div>

                <div class="mobile-menu-btn" onclick="this.nextElementSibling.classList.toggle('active')">
            <i class="fa-solid fa-bars"></i>
        </div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/events">Events</a></li>
            <li><a href="/admin">Dashboard</a></li>
        </ul>

    </nav>


    <div class="form-container">

        <h1>Edit Event ✏️</h1>

        <form method="POST" action="{{ url_for('edit_event', event_id=event[0]) }}">

            <div class="form-group">
                <label>Event Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ event[1] }}"
                    required>
            </div>

            <div class="form-group">
                <label>Description</label>

                <textarea
                    name="description"
                    rows="5"
                    required>{{ event[2] }}</textarea>
            </div>

            <div class="form-group">
                <label>Event Date</label>

                <input
                    type="date"
                    name="event_date"
                    value="{{ event[3] }}"
                    required>
            </div>

            <div class="form-group">
                <label>Location</label>

                <input
                    type="text"
                    name="location"
                    value="{{ event[4] }}"
                    required>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i> Save Changes
            </button>

        </form>

    </div>


    <footer class="footer">

        <p>© 2026 RAIT Events | RAIT, DY Patil University Campus, Nerul, Navi Mumbai</p>

    </footer>


    <!-- Lenis Smooth Scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const lenis = new Lenis({
                duration: 0.6,
                easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                direction: 'vertical',
                gestureDirection: 'vertical',
                smooth: true,
                smoothTouch: false,
                touchMultiplier: 2
            });

            function raf(time) {
                lenis.raf(time);
                requestAnimationFrame(raf);
            }

            requestAnimationFrame(raf);
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Event - CampusEvents</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    {% include 'toast.html' %}

    <nav class="navbar">

        <div class="logo">
            🎓 CampusEvents
        </div>

        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/events">Events</a></li>
            <li><a href="/admin">Dashboard</a></li>
        </ul>

    </nav>


    <div class="form-container">

        <h1>Edit Event ✏️</h1>

        <form method="POST" action="{{ url_for('edit_event', event_id=event[0]) }}">

            <div class="form-group">
                <label>Event Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ event[1] }}"
                    required>
            </div>

            <div class="form-group">
                <label>Description</label>

                <textarea
                    name="description"
                    rows="5"
                    required>{{ event[2] }}</textarea>
            </div>

            <div class="form-group">
                <label>Event Date</label>

                <input
                    type="date"
                    name="event_date"
                    value="{{ event[3] }}"
                    required>
            </div>

            <div class="form-group">
                <label>Location</label>

                <input
                    type="text"
                    name="location"
                    value="{{ event[4] }}"
                    required>
            </div>

            <button type="submit" class="btn btn-primary">
                💾 Save Changes
            </button>

        </form>

    </div>


    <footer class="footer">

        <p>© 2026 CampusEvents</p>

    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - CampusEvents</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>
    {% include 'toast.html' %}

    <nav class="navbar">
        <div class="logo">
            🎓 CampusEvents <span style="color: #666; font-size: 16px;">| Admin</span>
        </div>
        
        {% include "event_search_bar.html" %}
        
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/events">🎉 Events</a></li>
        </ul>
    </nav>

    <div class="login-container">

        <div class="login-card">

            <div class="login-icon">
                🔐
            </div>

            <h1>Admin Login</h1>

            <p>
                Login to manage college events
            </p>


            <form method="POST"
                  action="/login">

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            name="password"
                            id="adminPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="toggleAdminPassword()"
                        >
                            👁️
                        </button>

                    </div>

                    <script>
                    function toggleAdminPassword() {

                        const password = document.getElementById("adminPassword");
                        const button = document.querySelector(".password-toggle");

                        if (password.type === "password") {
                            password.type = "text";
                            button.textContent = "🙈";
                        } else {
                            password.type = "password";
                            button.textContent = "👁️";
                        }
                    }
                    </script>

                </div>

                <div style="text-align: right; margin-top: 8px;">
                    <a href="{{ url_for('admin_forgot_password') }}">
                        Forgot Password?
                    </a>
                </div>

                <div style="text-align: center; margin-top: 15px;">

                    <a href="{{ url_for('organizer_register') }}">
                        👤 Register as Organizer
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary login-btn">

                    Login

                </button>

            </form>


            <a href="/">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>

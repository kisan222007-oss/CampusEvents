<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ request.args.get('role', 'Admin').title() }} Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    {% include 'toast.html' %}


    <div class="login-container">

        <div class="login-card">

            <div style="text-align: center; margin-bottom: 20px;">
                <i class="fa-solid fa-user-tie" style="font-size: 40px; color: #A6192E;"></i>
            </div>

            <h2>{{ request.args.get('role', 'Admin').title() }} Login</h2>

            <p style="text-align: center; margin-bottom: 30px; color: #666;">
                Login to the {{ request.args.get('role', 'admin') }} dashboard.
            </p>

            <form method="POST" action="/login">

                <div class="form-group">

                    <label>Username</label>

                    <div class="input-icon">
                        <i class="fa-solid fa-user"></i>
                        <input
                            type="text"
                            name="username"
                            placeholder="Enter username"
                            required>
                    </div>

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            type="password"
                            name="password"
                            placeholder="Enter password"
                            required>
                    </div>

                </div>

                <div style="text-align: right; margin-bottom: 20px;">
                    <a
                        href="/admin-forgot-password"
                        style="color: #666; font-size: 14px; text-decoration: none;">

                        Forgot Password?

                    </a>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                    style="width: 100%;">

                    Login

                </button>

            </form>

            <div style="margin-top: 25px; text-align: center;">

                <a href="/"
                   class="btn"
                   style="font-size: 14px;">
                    ← Back to Home
                </a>

            </div>
            
            {% if request.args.get('role') == 'organizer' %}
            <div style="margin-top: 15px; text-align: center; font-size: 14px;">
                Want to host an event? 
                <a href="/organizer-register" style="color: var(--primary-color); font-weight: 600;">Register here</a>
            </div>
            {% endif %}

        </div>

    </div>

</body>

</html>
